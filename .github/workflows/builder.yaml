---
name: Builder

env:
  MONITORED_FILES: "config.yaml Dockerfile rootfs apparmor.txt"

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  init:
    runs-on: ubuntu-latest
    name: ⏳ Initialize builds
    outputs:
      addons: ${{ steps.changed_addons.outputs.addons }}
    steps:
      - name: ⤵️ Check out the repository
        uses: actions/checkout@v7.0.1
      - name: 🗝️ Get changed files
        id: changed_files
        uses: jitterbit/get-changed-files@v1
        if: github.event_name != 'workflow_dispatch'
      - name: 🚀 Find add-on directories
        id: addons
        uses: home-assistant/actions/helpers/find-addons@master
      - name: 🦺 Get changed add-ons
        id: changed_addons
        run: |
          changed_addons=()
          # Rebuild all add-ons when the build workflows change
          if [[ "${{ steps.changed_files.outputs.all }}" =~ \.github/workflows/(builder|build-addon)\.yaml ]]; then
            for addon in ${{ steps.addons.outputs.addons }}; do
              changed_addons+=("\"${addon}\",");
            done
          fi
          for addon in ${{ steps.addons.outputs.addons }}; do
            for file in ${{ env.MONITORED_FILES }}; do
              if [[ "${{ steps.changed_files.outputs.all }}" =~ "${addon}/${file}" ]] && [[ ! "${changed_addons[@]}" =~ $addon ]]; then
                  changed_addons+=("\"${addon}\",");
              fi
            done
          done

          changed=$(echo ${changed_addons[@]} | rev | cut -c 2- | rev)
          echo "addons=[$changed]" >> $GITHUB_OUTPUT;
          echo "Changed add-ons: [$changed]";

  build:
    needs: init
    if: needs.init.outputs.addons != '[]'
    name: 👷‍♂️ Build ${{ matrix.addon }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJson(needs.init.outputs.addons) }}
    uses: ./.github/workflows/build-addon.yaml
    with:
      addon: ${{ matrix.addon }}
      publish: false
    secrets: inherit
