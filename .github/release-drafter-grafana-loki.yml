---
name-template: "grafana-loki $RESOLVED_VERSION"
tag-template: "grafana-loki-$RESOLVED_VERSION"
tag-prefix: "grafana-loki-"
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
no-changes-template: "- No changes"
sort-direction: ascending

categories:
  ## Only changes touching this add-on
  - type: "pre-include"
    when:
      path: "grafana-loki/**"

  ## Changelog
  - title: "🚨 Breaking changes"
    when:
      label: "breaking-change"
  - title: "✨ New features"
    when:
      label: "new-feature"
  - title: "🐛 Bug fixes"
    when:
      label: "bugfix"
  - title: "🚀 Enhancements"
    when:
      labels:
        - "enhancement"
        - "refactor"
        - "performance"
  - title: "🧰 Maintenance"
    when:
      labels:
        - "maintenance"
        - "ci"
  - title: "📚 Documentation"
    when:
      label: "documentation"
  - title: "🌎 Translations"
    when:
      label: "translations"
  - title: "⬆️ Dependency updates"
    when:
      label: "dependencies"

  ## Version resolver
  - type: "version-resolver"
    semver-increment: "major"
    when:
      labels:
        - "major"
        - "breaking-change"
  - type: "version-resolver"
    semver-increment: "minor"
    when:
      labels:
        - "minor"
        - "new-feature"
  - type: "version-resolver"
    semver-increment: "patch"

template: |
  # Changes

  $CHANGES
